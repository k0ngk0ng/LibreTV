name: Sync upstream into legacy

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    name: Fast-forward legacy from upstream
    runs-on: ubuntu-latest
    if: ${{ github.event.repository.fork }}

    steps:
      - name: Check out legacy branch
        uses: actions/checkout@v4
        with:
          ref: legacy
          fetch-depth: 0

      - name: Fast-forward from LibreSpark/LibreTV
        shell: bash
        run: |
          git remote add upstream https://github.com/LibreSpark/LibreTV.git
          git fetch --no-tags upstream main
          git merge --ff-only upstream/main
          git push origin HEAD:legacy
