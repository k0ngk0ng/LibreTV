<!DOCTYPE html>
<html lang="zh">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>隐私政策 - LibreTV</title>
	<script src="libs/tailwindcss.min.js"></script>
	<link rel="stylesheet" href="css/styles.css">
	<link rel="manifest" href="manifest.json" crossorigin="use-credentials">
</head>
<body class="page-bg text-white">
	<div class="container mx-auto px-4 py-8">
		<header class="text-center mb-8">
			<h1 class="text-5xl font-bold gradient-text">隐私政策</h1>
		</header>
		<main class="text-center">
			<p class="text-gray-300 mb-4">
				账户版 LibreTV 会在部署者配置的数据目录中保存用户名、加盐密码哈希、账户状态和观看记录，用于登录验证与跨设备同步播放历史；不会保存明文密码。
			</p>
			<p class="text-gray-300 mb-4">
				搜索、封面和播放内容来自部署者配置的第三方接口。访问这些接口时，第三方服务可能按其自身政策处理网络请求信息。
			</p>
			<p class="text-gray-300">
				如需重置账户、清除观看记录或删除用户，请联系当前 LibreTV 实例的管理员。
			</p>
		</main>
		<footer class="mt-12 text-center">
			<div class="flex justify-center space-x-4">
				<a href="/" class="text-gray-400 hover:text-white transition-colors">回到首页</a>
			</div>
		</footer>
	</div>
</body>
</html>
