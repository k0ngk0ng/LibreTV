services:
  libretv:
    image: ${LIBRETV_IMAGE:-ghcr.io/k0ngk0ng/libretv}:${LIBRETV_TAG:-latest}
    container_name: libretv
    ports:
      - "8899:8080"
    environment:
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?请在 .env 中设置 ADMIN_PASSWORD}
      DATA_DIR: /app/data
      API_CONFIG_FILE: ${API_CONFIG_FILE:-/app/config/sites.json}
      API_CONFIG_STRICT: ${API_CONFIG_STRICT:-false}
      TRUST_PROXY: ${TRUST_PROXY:-true}
      COOKIE_SECURE: ${COOKIE_SECURE:-auto}
      SESSION_IDLE_HOURS: ${SESSION_IDLE_HOURS:-168}
      SESSION_MAX_DAYS: ${SESSION_MAX_DAYS:-30}
      REQUEST_TIMEOUT: ${REQUEST_TIMEOUT:-15000}
      MAX_RETRIES: ${MAX_RETRIES:-2}
    volumes:
      - libretv_data:/app/data
    restart: unless-stopped

volumes:
  libretv_data:
